<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="launchpad-token" content="__TOKEN__">
    <title>Launchpad</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/chrome.css">
    <script type="module" src="/app.js"></script>
</head>

<body>
    <header class="topbar" id="titlebar">
        <div class="titlebar-brand"><span class="launchpad-logo" role="img"
                aria-label="Launchpad logo"></span><span>Launchpad</span></div>
        <div class="window-controls" aria-label="Window controls"><button id="window-minimize" aria-label="Minimize"
                title="Minimize" disabled><svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 12h12" />
                </svg></button><button id="window-maximize" aria-label="Maximize" title="Maximize" disabled><svg
                    viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="6" y="6" width="12" height="12" />
                </svg></button><button id="window-close" aria-label="Close" title="Close" disabled><svg
                    viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m6 6 12 12M6 18 18 6" />
                </svg></button></div>
    </header>
    <aside class="rail">
        <nav aria-label="Main navigation">
            <button data-page="launch"></button>
            <button data-page="mods"></button>
            <!--
            <button data-page="friends"></button>
            -->
        </nav>
        <div class="rail-bottom">
            <button class="rail-settings" data-page="settings"></button>
            <button id="account" class="account"><span class="avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/></svg></span><span>Sign in<small>Connect MonkeForge</small></span></button>
        </div>
    </aside>
    <div class="workspace">
        <main id="content" tabindex="-1"></main>
        <footer><span>(C) 2026 MonkeForge</span><span>MonkeForge Launchpad</span></footer>
    </div>
    
    <div id="toast" role="status" hidden></div>
    <dialog id="confirm">
        <h2 id="confirm-title"></h2>
        <p id="confirm-description"></p>
        <div class="actions"><button class="button subtle" id="confirm-cancel">Cancel</button><button class="button"
                id="confirm-ok">Continue</button></div>
    </dialog>
</body>

</html>
